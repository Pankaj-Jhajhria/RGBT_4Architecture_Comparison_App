<text x="58" y="544" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e8eefc" text-anchor="start" >Optional ground-truth label</text>
<text x="58" y="570" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9db0d8" text-anchor="start" >Class IDs 0–8, 255 = ignore</text>
<rect x="350" y="148" width="290" height="356" rx="10" fill="#13224a" stroke="#2b4286" stroke-width="1.5" />
<text x="370" y="184" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e8eefc" text-anchor="start"><tspan x="370" dy="0">Split / convert channels</tspan></text>
<text x="370" y="214" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#9db0d8" text-anchor="start"><tspan x="370" dy="0">4-ch PNG → RGB (ch 0–2)</tspan><tspan x="370" dy="22">            + thermal (ch 3, mode L)</tspan><tspan x="370" dy="22">Separate files → RGB / L</tspan><tspan x="370" dy="22">Thermal needs &gt;1 unique value</tspan></text>
<rect x="370" y="326" width="250" height="2" rx="1" fill="#2b4286" stroke="#2b4286" stroke-width="0" />
