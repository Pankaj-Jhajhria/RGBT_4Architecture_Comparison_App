<text x="370" y="386" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#9db0d8" text-anchor="start"><tspan x="370" dy="0">RGB and thermal: bilinear</tspan><tspan x="370" dy="22">Ground-truth mask: nearest</tspan><tspan x="370" dy="22">Warns if sizes differ</tspan></text>
<text x="370" y="468" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#22d3ee" text-anchor="start" >Same scene → all four models</text>
