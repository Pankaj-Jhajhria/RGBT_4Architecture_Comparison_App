<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d">
<title id="t">Application workflow</title><desc id="d">Flow from input selection through RGB and thermal handling, four separate model-specific preprocessing and inference paths, predictions, overlays, class analysis and optional ground-truth evaluation.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1226"/><stop offset="1" stop-color="#0f1b3a"/></linearGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b82f6"/><stop offset="0.6" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#22d3ee"/></marker>
<marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#9db0d8"/></marker>

</defs>
<rect width="1600" height="1000" fill="url(#bg)"/>
<text x="40" y="52" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#e8eefc" text-anchor="start" >Application workflow</text>
<text x="40" y="82" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#9db0d8" text-anchor="start" >Every model has its own preprocessing and inference path. Source: app.py, inference/preprocessing.py, inference/model_loaders.py</text>
<text x="40" y="126" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#22d3ee" text-anchor="start" letter-spacing="2">1 · INPUT SOURCE</text>
<text x="350" y="126" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#22d3ee" text-anchor="start" letter-spacing="2">2 · INPUT HANDLING</text>
<text x="690" y="126" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#22d3ee" text-anchor="start" letter-spacing="2">3 · MODEL-SPECIFIC PATHS</text>
<text x="1230" y="126" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#22d3ee" text-anchor="start" letter-spacing="2">4 · OUTPUTS &amp; ANALYSIS</text>
<rect x="40" y="148" width="270" height="96" rx="10" fill="#13224a" stroke="#2b4286" stroke-width="1.5" />
<text x="58" y="184" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#e8eefc" text-anchor="start" >MFNet 4-channel PNG</text>
<text x="58" y="212" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9db0d8" text-anchor="start" >H×W×4, 8-bit; RGB + thermal</text>
<rect x="40" y="268" width="270" height="96" rx="10" fill="#13224a" stroke="#2b4286" stroke-width="1.5" />
<text x="58" y="304" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#e8eefc" text-anchor="start" >Separate RGB + thermal</text>
<text x="58" y="332" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9db0d8" text-anchor="start" >Two aligned images</text>
<rect x="40" y="388" width="270" height="96" rx="10" fill="#13224a" stroke="#2b4286" stroke-width="1.5" />
<text x="58" y="424" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#e8eefc" text-anchor="start" >Local MFNet sample</text>
<text x="58" y="452" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9db0d8" text-anchor="start" >Sibling MFNet_dataset/ folder</text>
